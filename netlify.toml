# Netlify build config for the CipherMind frontend (Vite app in /frontend).
# The site builds from the frontend/ directory and publishes its dist output.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"          # relative to base -> frontend/dist

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so client-side navigation resolves to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
